[project]
name = "rebounding"
version = "0.1.0"
description = "Predicting NBA rebounds from SportVU tracking data"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    # Fetches Basketball-Reference pages; see rebounding/data/bref.py.
    "requests>=2.31",
    "pyarrow>=15.0",
]

[project.optional-dependencies]
models = [
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    "torch>=2.2",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "matplotlib>=3.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rebounding"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
